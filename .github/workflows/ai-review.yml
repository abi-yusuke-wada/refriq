name: AI Review

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  review:
    name: AI Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check AI Review secrets
        env:
          LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$LLM_API_BASE_URL" || -z "$LLM_API_KEY" ]]; then
            echo "::error::Configure the LLM_API_BASE_URL and LLM_API_KEY repository secrets."
            exit 1
          fi

      - name: Review pull request
        uses: abi-techinnovation/github-review-app@8a21edca00d6a9c3c5830b1de93a097911c9a727 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_base_url: ${{ secrets.LLM_API_BASE_URL }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          review_model: ${{ vars.REVIEW_MODEL || 'preview/Kimi-K2.7-Code' }}
